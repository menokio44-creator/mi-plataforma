<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear tu Tienda - Mi Plataforma</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Empezá tu Tienda 🚀</h1>
        <p>Elegí un nombre para tu negocio</p>
        <input type="text" id="nombreTienda" placeholder="Ej: mi-negocio-cool">
        <button onclick="crear()">Crear mi Tienda</button>
    </div>

    <script>
        async function crear() {
            const nombre = document.getElementById('nombreTienda').value.trim().toLowerCase().replace(/\s+/g, '-');
            if(!nombre) return alert("Poné un nombre válido");

            const res = await fetch('/api/tiendas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nombre })
            });

            if(res.ok) {
                localStorage.setItem('nombreTiendaReciente', nombre);
                window.location.href = '/panel.html';
            } else {
                alert("Ese nombre ya existe o hubo un error.");
            }
        }
    </script>
</body>
</html>
