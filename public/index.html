<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuPlataforma - Crea tu tienda online</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; color: #333; }
        header { background: #2563eb; color: white; padding: 100px 20px; text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; }
        .btn { background: white; color: #2563eb; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 20px;}
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-top: 40px; }
        .card { padding: 30px; border: 1px solid #ddd; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Crea tu Tienda Online en Paraguay</h1>
        <p>Vende por internet sin saber programar. Cobros con Bancard y Pagopar incluidos.</p>
        <a href="/crear-tienda.html" class="btn">Comenzar Prueba Gratis</a>
    </header>

    <div class="container">
        <h2>¿Por qué elegirnos?</h2>
        <div class="grid">
            <div class="card"><h3>🚀 Rápido</h3><p>Tu tienda lista en 2 minutos.</p></div>
            <div class="card"><h3>💳 Pagos Locales</h3><p>Cobra en Guaraníes fácil.</p></div>
            <div class="card"><h3>📱 Móvil</h3><p>Administra desde tu celular.</p></div>
        </div>
    </div>
</body>
</html>
