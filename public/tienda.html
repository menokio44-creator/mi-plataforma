<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        header { background: #2563eb; padding: 25px; text-align: center; color: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .info { padding: 20px; }
        .price { font-size: 1.4rem; font-weight: bold; color: #2563eb; margin: 10px 0; }
        .btn { display: block; width: 100%; padding: 12px; background: #25d366; color: white; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <header id="headerTienda">
        <h1 id="nombreTienda">Cargando Tienda...</h1>
    </header>

    <div class="container">
        <div id="gridProductos" class="grid"></div>
    </div>

    <script>
        const nombre = window.location.pathname.split('/').pop();
        document.getElementById('nombreTienda').innerText = nombre.replace(/-/g, ' ');

        async function cargar() {
            const res = await fetch(`/api/productos/${nombre}`);
            const productos = await res.json();
            const grid = document.getElementById('gridProductos');
            
            // Cargar personalización
            const color = localStorage.getItem(`color_${nombre}`) || '#2563eb';
            const whatsapp = localStorage.getItem(`ws_${nombre}`) || '595981123456';
            
            document.getElementById('headerTienda').style.backgroundColor = color;

            if(productos.length === 0) {
                grid.innerHTML = '<p>Aún no hay productos en esta tienda.</p>';
                return;
            }

            let html = '';
            productos.forEach(p => {
                const img = p.imagen || 'https://via.placeholder.com/300';
                const msg = encodeURIComponent(`¡Hola! Me interesa el producto: ${p.nombre} (Gs. ${p.precio})`);
                const link = `https://wa.me/${whatsapp}?text=${msg}`;
                
                html += `
                    <div class="card">
                        <img src="${img}">
                        <div class="info">
                            <h3>${p.nombre}</h3>
                            <div class="price">Gs. ${p.precio}</div>
                            <a href="${link}" target="_blank" class="btn" style="background-color: ${color}">Comprar por WhatsApp 📱</a>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        cargar();
    </script>
</body>
</html>
