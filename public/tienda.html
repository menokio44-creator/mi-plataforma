<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8fafc; }
        header { background: #2563eb; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .btn-wa { display: block; background: #25d366; color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <header><h1 id="tTitle">Cargando...</h1></header>
    <div class="container">
        <div id="grid" class="grid"></div>
    </div>

    <script>
        const tienda = window.location.pathname.split('/').pop();
        document.getElementById('tTitle').innerText = tienda.toUpperCase();

        async function cargar() {
            const res = await fetch(`/api/productos/${tienda}`);
            const prods = await res.json();
            const ws = localStorage.getItem(`ws_${tienda}`) || '595981123456';
            const contenedor = document.getElementById('grid');

            contenedor.innerHTML = prods.map(p => {
                const msg = encodeURIComponent(`Hola! Quiero: ${p.nombre} (Gs. ${p.precio})`);
                return `
                <div class="card">
                    <img src="${p.imagen || 'https://via.placeholder.com/200'}">
                    <div class="card-body">
                        <h3>${p.nombre}</h3>
                        <p>Gs. ${p.precio}</p>
                        <a href="https://wa.me/${ws}?text=${msg}" class="btn-wa" target="_blank">Pedir por WhatsApp</a>
                    </div>
                </div>`;
            }).join('');
        }
        cargar();
    </script>
</body>
</html>
