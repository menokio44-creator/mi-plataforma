<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f6; }
        .sidebar { width: 250px; background: #1e293b; color: white; display: flex; flex-direction: column; }
        .sidebar h2 { padding: 20px; text-align: center; border-bottom: 1px solid #334155; margin: 0; }
        .menu { list-style: none; padding: 0; margin-top: 20px; }
        .menu li a { display: block; padding: 15px 20px; color: #cbd5e1; text-decoration: none; cursor:pointer; }
        .menu li a:hover, .active { background: #2563eb; color: white; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-action { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .product-list { margin-top: 30px; background: white; padding: 20px; border-radius: 10px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 15px; background: #eee; }
        #modalProducto { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; box-sizing: border-box; }
        
        /* Sección Configuración */
        #seccionConfig { display: none; background: white; padding: 30px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Mi Tienda 🛒</h2>
        <ul class="menu">
            <li><a id="btnProd" onclick="verSeccion('productos')" class="active">📦 Productos</a></li>
            <li><a id="btnConf" onclick="verSeccion('config')">🎨 Diseño/Color</a></li>
            <li><a href="/">🚪 Salir</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div id="seccionProductos">
            <div class="header">
                <h1>Hola, <span id="nombreUsuario">...</span></h1>
                <button class="btn-action" onclick="abrirModal()">+ Nuevo Producto</button>
            </div>
            <div class="product-list" id="listaProductos">
                <h3>Tus Productos</h3>
                <p>Cargando...</p>
            </div>
        </div>

        <div id="seccionConfig">
            <h1>Personaliza tu Tienda</h1>
            <p>Elige el color principal de tu marca:</p>
            <input type="color" id="colorTienda" style="height: 100px; cursor: pointer;" onchange="actualizarColor(this.value)">
            <p>Este color se verá en los botones y cabecera de tu tienda pública.</p>
            <button class="btn-action" onclick="alert('Color guardado localmente')">Guardar Cambios</button>
        </div>
    </div>

    <div id="modalProducto">
        <div class="modal-content">
            <h3>Nuevo Producto</h3>
            <input type="text" id="prodNombre" placeholder="Nombre">
            <input type="number" id="prodPrecio" placeholder="Precio">
            <input type="text" id="prodImagen" placeholder="URL Imagen">
            <button class="btn-action" onclick="guardarProducto()">Guardar</button>
            <button class="btn-action" style="background: #999;" onclick="cerrarModal()">Cancelar</button>
        </div>
    </div>

    <script>
        const tiendaActual = localStorage.getItem('nombreTiendaReciente');
        document.getElementById('nombreUsuario').innerText = tiendaActual;

        // Navegación entre pestañas
        function verSeccion(seccion) {
            if(seccion === 'productos') {
                document.getElementById('seccionProductos').style.display = 'block';
                document.getElementById('seccionConfig').style.display = 'none';
                document.getElementById('btnProd').classList.add('active');
                document.getElementById('btnConf').classList.remove('active');
            } else {
                document.getElementById('seccionProductos').style.display = 'none';
                document.getElementById('seccionConfig').style.display = 'block';
                document.getElementById('btnConf').classList.add('active');
                document.getElementById('btnProd').classList.remove('active');
            }
        }

        // Guardar color en el "ADN" de la tienda
        function actualizarColor(color) {
            localStorage.setItem(`color_${tiendaActual}`, color);
        }

        async function cargarProductos() {
            const respuesta = await fetch(`/api/productos/${tiendaActual}`);
            const productos = await respuesta.json();
            const listaDiv = document.getElementById('listaProductos');
            let html = '<h3>Tus Productos</h3>';
            productos.forEach(prod => {
                const imgUrl = prod.imagen || 'https://via.placeholder.com/50';
                html += `<div class="product-item"><div style="display:flex; align-items:center;"><img src="${imgUrl}" class="thumb"><strong>${prod.nombre}</strong></div><span>Gs. ${prod.precio}</span></div>`;
            });
            listaDiv.innerHTML = html;
        }
        cargarProductos();

        function abrirModal() { document.getElementById('modalProducto').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modalProducto').style.display = 'none'; }

        async function guardarProducto() {
            const datos = {
                tienda: tiendaActual,
                nombre: document.getElementById('prodNombre').value,
                precio: document.getElementById('prodPrecio').value,
                imagen: document.getElementById('prodImagen').value
            };
            await fetch('/api/productos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            cerrarModal();
            cargarProductos();
        }
    </script>
</body>
</html>
