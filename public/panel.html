<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f6; }
        .sidebar { width: 250px; background: #1e293b; color: white; padding: 20px; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .grid-prods { display: grid; gap: 10px; margin-top: 20px; }
        .item-prod { background: #fff; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Panel SaaS</h2>
        <p>Tienda: <strong id="shopName">...</strong></p>
        <hr>
        <button class="btn" onclick="location.href='/crear-tienda.html'" style="background:#475569">Cambiar Tienda</button>
    </div>
    <div class="main">
        <div class="card">
            <h3>⚙️ Configuración de Contacto</h3>
            <label>WhatsApp (ej: 595981123456):</label>
            <input type="text" id="wsInput" placeholder="Número sin el +">
            <button class="btn" onclick="guardarConfig()">Guardar WhatsApp</button>
        </div>

        <div class="card">
            <h3>📦 Agregar Producto</h3>
            <input type="text" id="pNombre" placeholder="Nombre del producto">
            <input type="number" id="pPrecio" placeholder="Precio Gs.">
            <input type="text" id="pImg" placeholder="URL de la imagen">
            <button class="btn" style="background:#10b981" onclick="agregarProd()">Publicar Producto</button>
        </div>

        <div class="card" id="lista">
            <h3>Tus Productos</h3>
            <div class="grid-prods" id="prodContenedor"></div>
        </div>
    </div>

    <script>
        const tienda = localStorage.getItem('nombreTiendaReciente');
        document.getElementById('shopName').innerText = tienda;
        document.getElementById('wsInput').value = localStorage.getItem(`ws_${tienda}`) || '';

        function guardarConfig() {
            const num = document.getElementById('wsInput').value;
            localStorage.setItem(`ws_${tienda}`, num);
            alert("WhatsApp guardado!");
        }

        async function agregarProd() {
            const datos = {
                tienda,
                nombre: document.getElementById('pNombre').value,
                precio: document.getElementById('pPrecio').value,
                imagen: document.getElementById('pImg').value
            };
            await fetch('/api/productos', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });
            location.reload();
        }

        async function cargar() {
            const res = await fetch(`/api/productos/${tienda}`);
            const prods = await res.json();
            const div = document.getElementById('prodContenedor');
            div.innerHTML = prods.map(p => `
                <div class="item-prod">
                    <span>${p.nombre}</span>
                    <strong>Gs. ${p.precio}</strong>
                </div>
            `).join('');
        }
        cargar();
    </script>
</body>
</html>
